<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Encontre o ecoponto ou local de descarte correto para resíduos, eletrônicos, óleo e recicláveis em Salto/SP. Projeto ondEco.">
  <title>OndEco Salto - O lugar certo para cada resíduo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="preload" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVc...woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <script src="script.js" defer></script>
</head>

<body>
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
  <header>
    <div class="logo-container">
      <div class="logo-main">
        <img src="assets/img/logo-icone.webp" alt="Logo ondEco" class="logo-ondeco" width="40" height="40">
        <h1 class="logo-texto">ondEco</h1>
      </div>
      <p class="tagline">O lugar certo para cada resíduo</p>
    </div>
  </header>

  <main id="main-content" class="container">
    <section class="filtros">
      <label for="inputBusca" class="sr-only">Buscar ecoponto por bairro ou material</label>
      <input type="text" id="inputBusca" placeholder="Busque por bairro ou material...">
      <label for="selectCategoria" class="sr-only">Filtrar por categoria de resíduo</label>
      <select id="selectCategoria">
        <option value="todos">Todas as Categorias</option>
        <option value="eletronicos">Eletrônicos e Baterias</option>
        <option value="medicamentos">Medicamentos Vencidos</option>
        <option value="oleo">Óleo de Cozinha</option>
        <option value="reciclaveis">Recicláveis (Plástico/Papel/Lata)</option>
        <option value="entulho">Móveis, Entulho e Podas</option>
      </select>
    </section>

    <h2 class="sr-only">Lista de Ecopontos e Locais de Descarte</h2>

    <section id="listaPontos" class="grid-pontos">
      <!-- Os cards são inseridos dinamicamente pelo JavaScript -->
    </section>
  </main>

  <footer>
    <div class="footer-container">
      <p class="footer-texto">
        <strong>ondEco Salto</strong> &copy; 2026 — Projeto de Extensão IFSP Câmpus Salto
      </p>
      <p class="footer-subtexto">
        Promovendo o descarte consciente e a sustentabilidade na comunidade saltense.
      </p>
    </div>
  </footer>

</body>

</html>
